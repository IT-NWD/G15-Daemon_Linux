name: Bauen und testen

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    name: Ubuntu 24.04 · ${{ matrix.compiler }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - compiler: GCC
            cc: gcc
          - compiler: Clang
            cc: clang
    env:
      CC: ${{ matrix.cc }}
    steps:
      - name: Quellcode auschecken
        uses: actions/checkout@v7

      - name: Bauabhängigkeiten installieren
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            autoconf automake build-essential libg15-dev libg15render-dev libtool python3

      - name: Bausystem erzeugen
        run: autoreconf --force --install

      - name: Konfigurieren
        run: ./configure --prefix=/usr --sbindir=/usr/bin

      - name: Bauen
        run: make --jobs=2

      - name: Tests ausführen
        run: make check

      - name: Distributionsarchiv prüfen
        run: make distcheck
