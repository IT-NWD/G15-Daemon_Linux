name: Fehlerbericht
description: Einen reproduzierbaren Fehler im Daemon oder Profileditor melden
title: "[Fehler]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Danke für die Meldung. Bitte keine vertraulichen Daten eintragen.
  - type: input
    id: version
    attributes:
      label: Version oder Commit
      description: Ausgabe von g15daemon --version oder Git-Commit
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: System
      description: Distribution, Version, Desktop und X11 oder Wayland
    validations:
      required: true
  - type: dropdown
    id: hardware
    attributes:
      label: Tastatur
      options:
        - Logitech G15 v1 mit blauer Beleuchtung
        - Anderes Logitech-Gerät
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Fehlerbeschreibung
      description: Was ist passiert und was wurde erwartet?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Schritte zum Reproduzieren
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevante Protokolle
      description: Ausgabe als Codeblock einfügen und vertrauliche Daten entfernen.
      render: shell
  - type: checkboxes
    id: checks
    attributes:
      label: Vorprüfung
      options:
        - label: Ich habe nach bereits gemeldeten Fehlern gesucht.
          required: true
        - label: Die Meldung enthält keine Passwörter oder vertraulichen Daten.
          required: true
