# Logitech G15 v1 profiles for the g15daemon uinput device.
# Obtain the stable device id with `sudo keyd monitor` and replace the id below
# if your g15daemon reports a different one.

[ids]
0000:0000:95e990cb

[global]
default_layout = m1

[aliases]
record = g1
rewind = g2
phone = g3
iso = g4
config = g5
homepage = g6
refresh = g7
exit = g8
move = g9
edit = g10
scrollup = g11
scrolldown = g12
kpleftparen = g13
kprightparen = g14
new = g15
redo = g16
f13 = g17
f14 = g18
f15 = m1
f16 = m2
f17 = m3
f18 = mr

# Replace `noop` with a key, shortcut, macro(...) or command(...).
# Examples: g1 = C-A-t
#           g2 = macro(Hello space World)

[main]
m1 = setlayout(m1)
m2 = setlayout(m2)
m3 = setlayout(m3)
mr = noop

